name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - 'environments/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Resolve target environment: default to 'dev' on push to main, or use input on manual dispatch
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ env.TARGET_ENV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/shopsphere-${{ env.TARGET_ENV }}-event-platform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8.x'

      - name: Init
        run: tofu init -backend-config=environments/${{ env.TARGET_ENV }}/backend.hcl

      - name: Apply
        run: |
          tofu apply -auto-approve \
            -var-file=environments/${{ env.TARGET_ENV }}/terraform.tfvars

      - name: Post-deploy validation
        run: |
          if [ -f "validation/validate-event-platform.sh" ]; then
            bash validation/validate-event-platform.sh ${{ env.TARGET_ENV }}
          else
            echo "⚠️ Validation script not found, skipping post-deploy check."
          fi