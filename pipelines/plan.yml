name: Terraform Plan

on:
  pull_request:
    paths:
      - '**.tf'
      - 'environments/**'
      - '.github/workflows/plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/shopsphere-${{ matrix.environment }}-event-platform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8.x'

      - name: Init
        run: tofu init -backend-config=environments/${{ matrix.environment }}/backend.hcl

      - name: Validate
        run: tofu validate

      - name: Plan
        run: |
          tofu plan \
            -var-file=environments/${{ matrix.environment }}/terraform.tfvars \
            -out=tfplan

      - name: Plan guard — block deletion/replacement of protected resources
        run: |
          tofu show -json tfplan > plan.json
          if [ -f "scripts/plan-guard.sh" ]; then
            bash scripts/plan-guard.sh plan.json
          else
            echo "⚠️ scripts/plan-guard.sh not found. Skipping custom guard check."
          fi

      - name: Post plan summary to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🚀 OpenTofu Plan — \`${{ matrix.environment }}\`\nPlan completed successfully and passed checks.`
            });