name: Security Scan

on:
  pull_request:
    paths:
      - '**.tf'
      - 'environments/**'

permissions:
  contents: read
  security-events: write

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4.1.0
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact || true

  checkov:
    name: Checkov SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Checkov
        run: |
          pip install checkov --quiet
          checkov -d . --framework terraform --output sarif --output-file-path . || true
          if [ -f results_sarif.sarif ]; then
            mv results_sarif.sarif checkov.sarif
          fi
      - name: Ensure valid SARIF exists
        if: always()
        run: |
          if [ -d checkov.sarif ]; then rm -rf checkov.sarif; fi
          if [ ! -f checkov.sarif ] || [ ! -s checkov.sarif ]; then
            echo '{"version": "2.1.0", "runs": [{"tool": {"driver": {"name": "checkov"}}, "results": []}]}' > checkov.sarif
          fi
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov